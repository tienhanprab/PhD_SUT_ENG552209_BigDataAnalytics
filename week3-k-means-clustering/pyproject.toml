[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-fibre-clustering"
version = "0.1.0"
description = "K-Means clustering of optical-fibre OTDR measurements"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "kagglehub>=1.0,<2",
  "matplotlib>=3.9,<4",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
build-kmeans-notebook = "optical_fibre_clustering.notebook:main"
download-otdr-data = "optical_fibre_clustering.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
