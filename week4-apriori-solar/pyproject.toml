[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-apriori"
version = "0.1.0"
description = "Apriori association-rule mining for solar photovoltaic operating conditions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "kagglehub>=1.0,<2",
  "matplotlib>=3.9,<4",
  "mlxtend>=0.23,<1",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
  "networkx>=3.3,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
build-solar-apriori-notebook = "solar_apriori.notebook:main"
download-solar-data = "solar_apriori.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

